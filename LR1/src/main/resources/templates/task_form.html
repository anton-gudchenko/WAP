<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Create task</title>
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <h1>Create task</h1>

  <form method="post" th:action="@{/app/tasks/create}" th:object="${taskForm}">
    <div>
      <label>Title</label><br/>
      <input th:field="*{title}" style="width: 420px;"/>
      <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:#b00020;"></div>
    </div>
    <div style="margin-top:10px;">
      <label>Description</label><br/>
      <textarea th:field="*{description}" style="width: 420px; height: 120px;"></textarea>
      <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:#b00020;"></div>
    </div>
    <div style="margin-top:10px;">
      <button type="submit">Create</button>
    </div>
  </form>
</body>
</html>
