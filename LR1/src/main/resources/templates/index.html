<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Лабораторная работа №1</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .muted { color: #666; }
    code { background: #f6f6f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Лабораторная работа №2</h1>

  <ul class="muted">
    <li>Вариант: <b th:text="${variant.code}">CODE</b></li>
    <li>LAST4: <b th:text="${variant.last4}">0000</b></li>
    <li>LAST2: <b th:text="${variant.last2}">00</b></li>
    <li>SUM: <b th:text="${variant.sum}">0</b></li>
    <li>SEED: <b th:text="${variant.seed}">0</b></li>
  </ul>

  <hr/>
  <form method="get" action="/">
    <label>Код зачётной книжки:</label>
    <label>
      <input name="code" style="width: 260px;" />
    </label>
    <button type="submit">Установить вариант</button>
  </form>
</body>
</html>
